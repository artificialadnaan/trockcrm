name: Pre-merge Build Gate

on:
  pull_request:

jobs:
  build-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build and test-inclusive typecheck gate
        run: npm run check:premerge
