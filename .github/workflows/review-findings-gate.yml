# Blocks a merge while the review bot has unresolved findings on the CURRENT head commit.
#
# The pre-merge build gate answers "does it compile and pass tests". It does not answer "did anyone
# object" — and on 2026-09-18 that gap let #1144 merge with four known findings, one of which made the
# feature it shipped inert. Every check was green. Green was not the same as correct.
#
# TRIGGERS, and why each is needed:
#   pull_request        - the push itself (a new commit invalidates any earlier verdict)
#   pull_request_review - the bot filing findings
#   issue_comment       - the bot posting or EDITING its review summary, which is how a clean pass
#                         becomes attributable to a commit. A 👍 reaction fires no webhook at all, so
#                         the summary edit is the only event that can tell us about one.
name: Review Findings Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-findings-gate:
    # issue_comment fires for plain issues too; only pull requests have a review verdict to check.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the gate script imports nothing outside node builtins and global fetch, and this job
      # should stay fast enough to re-run on every comment.
      - name: Install tsx
        run: npm install --no-save tsx@4

      - name: Evaluate the review verdict for the head commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: node --import tsx scripts/review-findings-gate.ts
